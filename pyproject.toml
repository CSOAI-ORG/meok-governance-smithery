[project]
name = "meok-governance-smithery"
version = "1.0.5"
description = "MEOK AI Labs MCP Server: meok-governance-smithery"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "MEOK AI Labs", email = "mcp@meok.ai"}
]
keywords = ["mcp", "ai", "meok", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://meok.ai"
Documentation = "https://docs.meok.ai/mcp/meok-governance-smithery"
Repository = "https://github.com/meok-ai/mcp-servers"

[build-system]
requires = ["hatchling>=1.13.0"]
build-backend = "hatchling.build"

[project.scripts]
meok_governance_smithery = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_Configs = true
disallow_untyped_defs = true

